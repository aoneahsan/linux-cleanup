[package]
name = "linux-cleanup-desktop"
version = "1.0.0"
description = "linux-cleanup desktop: preview the all-safe cleanup, then run it"
authors = ["Ahsan Mahmood"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "linux_cleanup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linux-cleanup-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
